# Read by webhook with -template: the file is rendered as a Go template first, so the
# secret comes from the environment (IICU_WEBHOOK_SECRET) and never lives in the repo.
# YAML rather than JSON because the template needs unescaped quotes inside the string.
- id: intervals-icu-mcp
  execute-command: /opt/intervals-icu-mcp/app/deploy/deploy.sh
  command-working-directory: /opt/intervals-icu-mcp/app
  response-message: deploy started
  trigger-rule-mismatch-http-response-code: 403
  trigger-rule:
    and:
      - match:
          type: payload-hmac-sha256
          secret: '{{ getenv "IICU_WEBHOOK_SECRET" | js }}'
          parameter:
            source: header
            name: X-Hub-Signature-256
      - match:
          type: value
          value: refs/heads/deploy
          parameter:
            source: payload
            name: ref
